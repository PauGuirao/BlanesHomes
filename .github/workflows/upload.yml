name: Upload data to Supabase

on:
  schedule:
    - cron: '0 5 * * *'  # Todos los días a las 5:00 UTC
  workflow_dispatch:     # También permite lanzarlo manualmente

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create .env file from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> backend/.env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> backend/.env

      - name: Run upload script
        run: python backend/crons/upload_supabase_data.py
